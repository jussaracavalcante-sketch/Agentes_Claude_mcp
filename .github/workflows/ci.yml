name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        run: pytest -q

  web:
    name: Console — typecheck e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: Varredura de credenciais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Procurar credenciais no diff
        run: |
          # Padrões de token que nunca devem entrar no repositório.
          if grep -rInE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
               --exclude-dir=dist --exclude=ci.yml .; then
            echo "::error::Credencial detectada. Remova antes do merge."
            exit 1
          fi
          echo "Nenhuma credencial detectada."
