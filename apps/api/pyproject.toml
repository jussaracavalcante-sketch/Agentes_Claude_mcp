[project]
name = "vkb-api"
version = "0.1.0"
description = "VKB · Vanguarda IA — plataforma de orquestracao e governanca de agentes"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
