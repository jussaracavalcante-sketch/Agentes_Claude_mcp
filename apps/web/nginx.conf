# O console e a API sao servidos na MESMA origem: o nginx entrega os assets e
# faz proxy de /api para o servico da API. Isso espelha o proxy do vite em
# desenvolvimento e elimina CORS do caminho de container — origem cruzada era a
# causa de o console nao conseguir logar em `docker compose up`.

upstream vkb_api {
    # Nome do servico no docker-compose.
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Erro de upstream nao deve virar pagina do nginx dentro de uma chamada de API.
    proxy_intercept_errors off;

    location /api/ {
        proxy_pass         http://vkb_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Execucao de agente pode passar de um minuto quando o provedor demora.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Documentacao da API e OpenAPI, uteis a partir do console.
    location = /openapi.json { proxy_pass http://vkb_api; }
    location /docs           { proxy_pass http://vkb_api; }
    location /health         { proxy_pass http://vkb_api; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida devolve o index, que roteia no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
